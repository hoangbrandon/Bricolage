<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/style/recipes.css">
    <link rel="stylesheet" href="/style/general.css">
    <title>Recipe Search</title>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="header-top">
                <div class="header-text">
                    <h2 class="header-title">Recipe Search</h2>
                    <p class="header-subtitles">
                    </p>
                </div>
                <button id="search-button" class="searchBtn">Search</button>
            </div>

            <div class="search-bar">
                <input class="search-bar" id="recipe-search-input" type="text" placeholder="search for ingredients">
                <div id ="selected-ingredients"></div>
                <div id="ingredient-dropdown" class="dropdown hidden"></div>
            </div>
        </div>
    </header>

        <main class="main-page">
        <div class="filter-bar">
            <h3>Filter Ingreident Types</h3>
           <div id="filter-ingredient-type-list"></div>
        </div>
        <div class="main-content">
            <div id="recipe-list" class="recipeList"></div>
        </div>
    </main>


    <script type="module">
        import { createClient } from "https://esm.sh/@supabase/supabase-js@2"

        const supabaseUrl = "https://xxlupwqcngojcijmkaji.supabase.co"
        const supabaseKey = "sb_publishable_SN5Hm9L_TJDRs7c64UTGAw_pPpyN27c"
        const supabase = createClient(supabaseUrl, supabaseKey)

        let selectedIngredients = []

        const searchInput = document.getElementById("recipe-search-input")
        const dropdown = document.getElementById("ingredient-dropdown")
        const selectedbox = document.getElementById("selected-ingredients")

        async function getUser() {
            const { data: { user }, error } = await supabase.auth.getUser()
            if ( error || !user ){
                window.location.href = 'login.html'
                return null
            }
            return user
        }

        async function searchPantryIngredients(query){
            const { data, error } = await supabase
                .from("ingredients")
                .select("ingredient_name")
                .ilike("ingredient_name", `%${query}%`)

            return data || []
        }

        async function searchRecipes(selectedIngredients) {
            const user = await getUser()
            if (!user) return
            const apiKey = "28eaa893403044b9b371bb514d9f38bc"
            const url = `https://api.spoonacular.com/recipes/complexSearch?includeIngredients=${(encodeURIComponent(selectedIngredients))}&number=12&apiKey=${apiKey}`;

            const response = await fetch(url)
            const data = await response.json()

            console.log("Recipes:", data.recipes)
            return data.results;
        }

        async function addIngredient(name){
            if(!selectedIngredients.includes(name)) {
                selectedIngredients.push(name)
            }

            renderSelectedIngredients();
        }

        async function renderDropdown(results) {
            if (!results || results.length === 0 ) {
                dropdown.innerHTML = ""
                dropdown.classList.add("hidden")
                return
            }

            dropdown.innerHTML = results
                .map(item => `<div class ="dropdown-item" data-name="${item.ingredient_name}">${item.ingredient_name}</div>`)
                .join("")

            dropdown.classList.remove("hidden")
        }

        async function fetchRecipeDetails(recipeId){
            const apiKey = "28eaa893403044b9b371bb514d9f38bc"
            const url = `https://api.spoonacular.com/recipes/${recipeId}/information?includeNutrition=false&&apiKey=${apiKey}`;

            const response = await fetch(url)
            const data = await response.json()
            return data
        }

        async function saveRecipe(recipeId, userId) {

            const numId = Number(recipeId)

            try {
                const {data: existing, error: checkError} = await supabase
                    .from("recipes")
                    .select("id")
                    .eq("id",numId)
                    .maybeSingle()

                if (checkError) throw checkError
                
                if (!existing) {
                    const recipeData = await fetchRecipeDetails(numId)

                    const recipeUrl = recipeData.sourceUrl ||
                    `https://spoonacular.com/recipes/${recipeData.title.replace(/ /g, "-")}-${numId}`

                    const {error: insertError} = await supabase
                    .from("recipes")
                    .insert({
                        id: numId,
                        recipe_name: recipeData.title,
                        duration: recipeData.readyInMinutes,
                        instructions: recipeData.instructions || "No Instructions Provided",
                        cost: recipeData.pricePerServing
                    })

                    if (insertError) throw insertError
                }

                const { error } = await supabase
                    .from("savedrecipes")
                    .insert({
                        user_id: userId,
                        recipe_id: numId
                    })
                
                if (error) throw error


            } catch (err) {
                console.error("Error saving recipe", err)
            }

        }

        function renderRecipes(recipes){
            const recipeList = document.getElementById("recipe-list")
            if (!recipes || recipes.length === 0) {
                recipeList.innerHTML = "No Recipes Found"
            }

            recipeList.innerHTML = recipes
                .map(recipe => {
                const recipeUrl = `https://spoonacular.com/recipes/${recipe.title.replace(/ /g, "-")}-${recipe.id}`
                
                return `
                    <div class="recipe-card">
                        <img src="${recipe.image}" alt="${recipe.title}">
                        <a href="${recipeUrl}" target="_blank" class="recipe-title">
                            ${recipe.title}
                        </a>
                        <button class ="save-button" data-id="${recipe.id}" data-title="${recipe.title}"> Save
                        </button>
                    </div>`
                })
        }

        function renderSelectedIngredients(){
            selectedbox.innerHTML = selectedIngredients
                .map(
                    ing =>`
                    <div class ="tag">
                    ${ing}
                    <span class ="remove-tag" data-name="${ing}">✕</span>
                    </div>`
                )
                .join("")
        }

        async function loadinitialRecipes() {
            const apiKey = "28eaa893403044b9b371bb514d9f38bc"
            const url = `https://api.spoonacular.com/recipes/random?number=12&apiKey=${apiKey}`;

            const response = await fetch(url)
            const data = await response.json()

            renderRecipes(data.recipes)
        }

        loadinitialRecipes()


        dropdown.addEventListener("click", (e) => {
            if (e.target.classList.contains("dropdown-item")) {
                const name = e.target.dataset.name
                addIngredient(name)
                dropdown.classList.add("hidden")
                searchInput.value = ""
            }
        })

        searchInput.addEventListener("input", async (e) => {
            const query = e.target.value.trim()
            if (!query){
                dropdown.classList.add("hidden")
                return
            }

            const results = await searchPantryIngredients(query)
            renderDropdown(results)
        })

        document.getElementById("search-button").addEventListener("click", async (e) => {
            if (selectedIngredients.length === 0) return

            const results = await searchRecipes(selectedIngredients)
            renderRecipes(results)
        })

        document.addEventListener("click", async (e) => {
            if (e.target.classList.contains("save-button")) {
                const user = await getUser()
                if (!user) return

                const recipe_id = e.target.dataset.id;
                
                saveRecipe(recipe_id, user.id)
            }
        })


        selectedbox.addEventListener("click", async (e) => {
            if (e.target.classList.contains("remove-tag")) {
                const name = e.target.dataset.name
                selectedIngredients = selectedIngredients.filter(i => i !== name)
                renderSelectedIngredients()
            }
        })

    </script>
</body>
</html>
